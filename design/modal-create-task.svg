<svg xmlns="http://www.w3.org/2000/svg" width="520" height="510" viewBox="0 0 520 510" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="modalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#091e42" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect x="20" y="20" width="480" height="470" rx="12" fill="#ffffff" filter="url(#modalShadow)" />

  <text x="46" y="64" font-size="20" font-weight="700" fill="#172b4d">Create New Task</text>

  <!-- Title -->
  <text x="46" y="96" font-size="13" font-weight="600" fill="#172b4d">Title *</text>
  <rect x="46" y="104" width="428" height="40" rx="8" fill="#ffffff" stroke="#dfe1e6" stroke-width="1.5" />
  <text x="58" y="129" font-size="14" fill="#172b4d">Design landing page UI</text>

  <!-- Description -->
  <text x="46" y="170" font-size="13" font-weight="600" fill="#172b4d">Description</text>
  <rect x="46" y="178" width="428" height="96" rx="8" fill="#ffffff" stroke="#dfe1e6" stroke-width="1.5" />
  <text x="58" y="203" font-size="14" fill="#172b4d">Create the homepage mockup in Figma.</text>
  <text x="58" y="223" font-size="14" fill="#172b4d">Keep the layout clean and responsive.</text>

  <!-- Priority -->
  <text x="46" y="302" font-size="13" font-weight="600" fill="#172b4d">Priority</text>
  <rect x="46" y="310" width="206" height="40" rx="8" fill="#ffffff" stroke="#dfe1e6" stroke-width="1.5" />
  <text x="58" y="335" font-size="14" fill="#172b4d">High</text>
  <path d="M228 326 L234 332 L240 326" fill="none" stroke="#5e6c84" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Due date -->
  <text x="268" y="302" font-size="13" font-weight="600" fill="#172b4d">Due date</text>
  <rect x="268" y="310" width="206" height="40" rx="8" fill="#ffffff" stroke="#dfe1e6" stroke-width="1.5" />
  <text x="280" y="335" font-size="14" fill="#172b4d">2026-09-15</text>

  <!-- Actions -->
  <rect x="258" y="386" width="98" height="40" rx="8" fill="none" />
  <text x="307" y="411" font-size="14" font-weight="600" fill="#5e6c84" text-anchor="middle">Cancel</text>
  <rect x="368" y="386" width="106" height="40" rx="8" fill="#0052cc" />
  <text x="421" y="411" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Add Task</text>
</svg>
