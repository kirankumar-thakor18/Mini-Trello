  <rect x="620" y="1350" width="300" height="130" rx="8" fill="#ffffff" />
  <line x1="624" y1="1362" x2="624" y2="1468" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
  <text x="638" y="1376" font-size="14" font-weight="600" fill="#172b4d">Design landing page UI</text>
  <text x="638" y="1396" font-size="13" fill="#5e6c84">Create the homepage mockup in Figma.</text>
  <rect x="638" y="1410" width="52" height="20" rx="10" fill="#ffece5" />
  <text x="664" y="1424" font-size="11" font-weight="700" fill="#bf2600" text-anchor="middle" letter-spacing="0.4">HIGH</text>
  <rect x="696" y="1410" width="62" height="20" rx="10" fill="#ffffff" stroke="#dfe1e6" />
  <text x="727" y="1424" font-size="11" font-weight="600" fill="#5e6c84" text-anchor="middle">Sep 15</text>
  <rect x="638" y="1440" width="28" height="24" rx="6" fill="#f0f2f5" />
  <text x="652" y="1457" font-size="13" fill="#c1c7d0" text-anchor="middle">&#8592;</text>
  <rect x="672" y="1440" width="28" height="24" rx="6" fill="#f0f2f5" />
  <text x="686" y="1457" font-size="13" fill="#5e6c84" text-anchor="middle">&#8594;</text>
  <rect x="706" y="1440" width="28" height="24" rx="6" fill="#f0f2f5" />
  <text x="720" y="1457" font-size="13" fill="#5e6c84" text-anchor="middle">&#9998;</text>
  <rect x="876" y="1440" width="28" height="24" rx="6" fill="#ffece5" />
  <text x="890" y="1458" font-size="15" fill="#bf2600" text-anchor="middle">&#215;</text>

