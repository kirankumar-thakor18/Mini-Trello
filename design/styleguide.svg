  <text x="60" y="830" font-size="22" font-weight="700" fill="#172b4d" letter-spacing="-0.5">Mini-Trello</text>
  <text x="1110" y="830" font-size="12" font-family="Consolas, monospace" fill="#5e6c84" text-anchor="end">22 / 700</text>

  <text x="60" y="870" font-size="20" font-weight="700" fill="#172b4d">Create New Task</text>
  <text x="1110" y="870" font-size="12" font-family="Consolas, monospace" fill="#5e6c84" text-anchor="end">20 / 700</text>

  <text x="60" y="905" font-size="15" font-weight="700" fill="#172b4d">In Progress</text>
  <text x="1110" y="905" font-size="12" font-family="Consolas, monospace" fill="#5e6c84" text-anchor="end">15 / 700</text>

  <text x="60" y="940" font-size="14" font-weight="600" fill="#172b4d">Design landing page UI</text>
  <text x="1110" y="940" font-size="12" font-family="Consolas, monospace" fill="#5e6c84" text-anchor="end">14 / 600</text>

  <text x="60" y="972" font-size="13" fill="#5e6c84">Create the homepage mockup in Figma.</text>
  <text x="1110" y="972" font-size="12" font-family="Consolas, monospace" fill="#5e6c84" text-anchor="end">13 / 400</text>

  <text x="60" y="1004" font-size="11" font-weight="700" fill="#bf2600" letter-spacing="0.4">HIGH PRIORITY</text>
  <text x="1110" y="1004" font-size="12" font-family="Consolas, monospace" fill="#5e6c84" text-anchor="end">11 / 700</text>

  <line x1="60" y1="1030" x2="1140" y2="1030" stroke="#dfe1e6" />

