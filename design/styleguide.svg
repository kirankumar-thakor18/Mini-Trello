    <rect x="60" y="435" width="110" height="64" rx="8" fill="#ef4444" />
    <text x="60" y="515" font-size="11" font-weight="700" fill="#172b4d">todo</text>
    <text x="60" y="529" font-size="11" font-family="Consolas, monospace" fill="#5e6c84">#ef4444</text>

    <rect x="240" y="435" width="110" height="64" rx="8" fill="#fdecec" />
    <text x="240" y="515" font-size="11" font-weight="700" fill="#172b4d">todo-soft</text>
    <text x="240" y="529" font-size="11" font-family="Consolas, monospace" fill="#5e6c84">#fdecec</text>

    <rect x="420" y="435" width="110" height="64" rx="8" fill="#f59e0b" />
    <text x="420" y="515" font-size="11" font-weight="700" fill="#172b4d">in-progress</text>
    <text x="420" y="529" font-size="11" font-family="Consolas, monospace" fill="#5e6c84">#f59e0b</text>

    <rect x="600" y="435" width="110" height="64" rx="8" fill="#fef4e4" />
    <text x="600" y="515" font-size="11" font-weight="700" fill="#172b4d">in-progress-soft</text>
