    <text x="60" y="400" font-size="11" font-weight="700" fill="#172b4d">primary-hover</text>
    <text x="60" y="414" font-size="11" font-family="Consolas, monospace" fill="#5e6c84">#0747a6</text>

    <rect x="240" y="320" width="110" height="64" rx="8" fill="#deebff" />
    <text x="240" y="400" font-size="11" font-weight="700" fill="#172b4d">primary-soft</text>
    <text x="240" y="414" font-size="11" font-family="Consolas, monospace" fill="#5e6c84">#deebff</text>

    <rect x="420" y="320" width="110" height="64" rx="8" fill="#00875a" />
    <text x="420" y="400" font-size="11" font-weight="700" fill="#172b4d">success</text>
    <text x="420" y="414" font-size="11" font-family="Consolas, monospace" fill="#5e6c84">#00875a</text>

