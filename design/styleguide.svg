    <text x="780" y="675" font-size="11" font-weight="700" fill="#172b4d">primary</text>
    <text x="780" y="689" font-size="11" font-family="Consolas, monospace" fill="#5e6c84">#4c8dff</text>

    <rect x="960" y="595" width="110" height="64" rx="8" fill="#f87171" />
    <text x="960" y="675" font-size="11" font-weight="700" fill="#172b4d">todo</text>
