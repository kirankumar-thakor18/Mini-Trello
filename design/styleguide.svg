  <text x="620" y="1070" font-size="18" font-weight="700" fill="#172b4d">04 — Radius</text>
  <g>
    <rect x="620" y="1096" width="64" height="44" rx="6" fill="#deebff" stroke="#0052cc" />
    <text x="620" y="1162" font-size="12" font-family="Consolas, monospace" fill="#5e6c84">6 · sm</text>
    <rect x="720" y="1096" width="64" height="44" rx="8" fill="#deebff" stroke="#0052cc" />
    <text x="720" y="1162" font-size="12" font-family="Consolas, monospace" fill="#5e6c84">8 · md</text>
    <rect x="820" y="1096" width="64" height="44" rx="10" fill="#deebff" stroke="#0052cc" />
    <text x="820" y="1162" font-size="12" font-family="Consolas, monospace" fill="#5e6c84">10 · lg</text>
    <rect x="920" y="1096" width="64" height="44" rx="12" fill="#deebff" stroke="#0052cc" />
    <text x="920" y="1162" font-size="12" font-family="Consolas, monospace" fill="#5e6c84">12 · xl</text>
    <rect x="1020" y="1114" width="100" height="26" rx="13" fill="#deebff" stroke="#0052cc" />
    <text x="1020" y="1162" font-size="12" font-family="Consolas, monospace" fill="#5e6c84">999 · pill</text>
  </g>

