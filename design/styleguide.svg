<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="1200" height="1500" fill="#f4f5f7" />

  <!-- Title -->
  <text x="60" y="72" font-size="28" font-weight="700" fill="#172b4d" letter-spacing="-0.5">Mini-Trello — Design System</text>
  <text x="60" y="100" font-size="14" fill="#5e6c84">Tokens, typography, spacing and components used in the live product.</text>
  <line x1="60" y1="122" x2="1140" y2="122" stroke="#dfe1e6" />

  <!-- 01 Color -->
  <text x="60" y="162" font-size="18" font-weight="700" fill="#172b4d">01 — Color</text>
  <text x="60" y="190" font-size="13" font-weight="600" fill="#5e6c84">Light theme</text>

  <!-- Row 1 -->
  <g>
    <rect x="60" y="205" width="110" height="64" rx="8" fill="#f4f5f7" stroke="#dfe1e6" />
    <text x="60" y="285" font-size="11" font-weight="700" fill="#172b4d">bg</text>
    <text x="60" y="299" font-size="11" font-family="Consolas, monospace" fill="#5e6c84">#f4f5f7</text>

    <rect x="240" y="205" width="110" height="64" rx="8" fill="#ffffff" stroke="#dfe1e6" />
    <text x="240" y="285" font-size="11" font-weight="700" fill="#172b4d">surface</text>
    <text x="240" y="299" font-size="11" font-family="Consolas, monospace" fill="#5e6c84">#ffffff</text>

    <rect x="420" y="205" width="110" height="64" rx="8" fill="#172b4d" />
    <text x="420" y="285" font-size="11" font-weight="700" fill="#172b4d">text</text>
    <text x="420" y="299" font-size="11" font-family="Consolas, monospace" fill="#5e6c84">#172b4d</text>

    <rect x="600" y="205" width="110" height="64" rx="8" fill="#5e6c84" />
    <text x="600" y="285" font-size="11" font-weight="700" fill="#172b4d">muted</text>
    <text x="600" y="299" font-size="11" font-family="Consolas, monospace" fill="#5e6c84">#5e6c84</text>

    <rect x="780" y="205" width="110" height="64" rx="8" fill="#dfe1e6" />
    <text x="780" y="285" font-size="11" font-weight="700" fill="#172b4d">border</text>
    <text x="780" y="299" font-size="11" font-family="Consolas, monospace" fill="#5e6c84">#dfe1e6</text>

    <rect x="960" y="205" width="110" height="64" rx="8" fill="#0052cc" />
    <text x="960" y="285" font-size="11" font-weight="700" fill="#172b4d">primary</text>
    <text x="960" y="299" font-size="11" font-family="Consolas, monospace" fill="#5e6c84">#0052cc</text>
