    <text x="600" y="400" font-size="11" font-weight="700" fill="#172b4d">warn</text>
    <text x="600" y="414" font-size="11" font-family="Consolas, monospace" fill="#5e6c84">#ff991f</text>

    <rect x="780" y="320" width="110" height="64" rx="8" fill="#bf2600" />
    <text x="780" y="400" font-size="11" font-weight="700" fill="#172b4d">danger</text>
    <text x="780" y="414" font-size="11" font-family="Consolas, monospace" fill="#5e6c84">#bf2600</text>

