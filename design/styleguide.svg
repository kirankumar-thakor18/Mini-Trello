  <circle cx="966" cy="1362" r="4" fill="#ef4444" />
  <text x="976" y="1366" font-size="11" font-weight="700" fill="#b91c1c">To Do</text>

  <rect x="950" y="1384" width="110" height="24" rx="12" fill="#fef4e4" />
  <circle cx="966" cy="1396" r="4" fill="#f59e0b" />
  <text x="976" y="1400" font-size="11" font-weight="700" fill="#92400e">In Progress</text>

  <rect x="950" y="1418" width="70" height="24" rx="12" fill="#e6f9ee" />
