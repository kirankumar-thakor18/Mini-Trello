  <g font-size="12" font-family="Consolas, monospace" fill="#5e6c84">
    <text x="60" y="1108">4</text><rect x="110" y="1096" width="24" height="14" rx="3" fill="#0052cc" fill-opacity="0.25" />
    <text x="60" y="1138">8</text><rect x="110" y="1126" width="48" height="14" rx="3" fill="#0052cc" fill-opacity="0.25" />
    <text x="60" y="1168">12</text><rect x="110" y="1156" width="72" height="14" rx="3" fill="#0052cc" fill-opacity="0.25" />
    <text x="60" y="1198">16</text><rect x="110" y="1186" width="96" height="14" rx="3" fill="#0052cc" fill-opacity="0.25" />
    <text x="60" y="1228">20</text><rect x="110" y="1216" width="120" height="14" rx="3" fill="#0052cc" fill-opacity="0.25" />
    <text x="60" y="1258">24</text><rect x="110" y="1246" width="144" height="14" rx="3" fill="#0052cc" fill-opacity="0.25" />
    <text x="60" y="1288">32</text><rect x="110" y="1276" width="192" height="14" rx="3" fill="#0052cc" fill-opacity="0.25" />
  </g>

