  <rect x="894" y="1232" width="96" height="40" rx="8" fill="#ffece5" />
  <text x="942" y="1257" font-size="14" font-weight="600" fill="#bf2600" text-anchor="middle">Delete</text>

  <rect x="620" y="1290" width="250" height="40" rx="8" fill="#ffffff" stroke="#dfe1e6" stroke-width="1.5" />
  <text x="634" y="1315" font-size="14" fill="#5e6c84">Search tasks...</text>

  <rect x="890" y="1298" width="52" height="20" rx="10" fill="#ffece5" />
  <text x="916" y="1312" font-size="11" font-weight="700" fill="#bf2600" text-anchor="middle" letter-spacing="0.4">HIGH</text>
  <rect x="950" y="1298" width="66" height="20" rx="10" fill="#fdecec" />
  <text x="983" y="1312" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle" letter-spacing="0.4">MEDIUM</text>
  <rect x="1024" y="1298" width="46" height="20" rx="10" fill="#fef4e4" />
  <text x="1047" y="1312" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle" letter-spacing="0.4">LOW</text>

